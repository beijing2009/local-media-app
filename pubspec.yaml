name: local_media_app
description: 本地音视频播放器（安卓 + iOS），纯本地运行，不依赖云端，轻量流畅。
publish_to: 'none'
version: 1.7.0+9 # v1.7.0：M3U8 本地密钥自动搜索（父级/同级目录 + 扫描根有界递归）

environment:
  # Flutter 3.0.0 对应 Dart 2.17
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 极简依赖，仅保留必要功能库，避免大体积 UI 框架
  provider: ^6.0.0          # 轻量状态管理（仅 ~数十 KB）
  video_player: ^2.4.0     # 原生视频播放（底层为 ExoPlayer / AVPlayer）
  audioplayers: ^1.1.1     # 轻量音频播放，支持倍速/后台
  sqflite: ^2.0.0          # 本地 SQLite，存储播放进度与专辑
  shared_preferences: ^2.0.0 # 本地外观设置
  permission_handler: ^9.0.0 # 安卓存储权限申请
  file_picker: ^4.6.1      # 文件夹/文件选取（安卓+iOS 通用）
  path: ^1.8.0             # 路径解析（basename/extension）
  path_provider: ^2.0.0    # 获取可写的输出目录（合并后的视频存放位置）
  encrypt: ^5.0.0          # AES 解密（HLS 分片加密，密钥取本机文件）

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  # 无任何图片资源，使用内置矢量图标，最大限度压缩包体
