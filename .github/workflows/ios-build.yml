name: Build iOS IPA

# 在 GitHub 的 macOS runner 上自动构建 iOS 安装包（无需你自备 Mac）
# 触发：推送到 main 分支，或手动在 Actions 页面点击 Run workflow
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    # 必须用 macos-latest：macos-13 镜像已被 GitHub 下线，请求该标签会永远排队
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Accept Xcode license & select Xcode
        run: |
          sudo xcodebuild -license accept
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.0.0'
          channel: 'stable'

      - name: Flutter doctor (信息)
        run: flutter doctor -v

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Patch Flutter Ruby helpers (File.exists? -> File.exist?)
        # 关键：Flutter 3.0.0 的 iOS 辅助脚本用了 File.exists?，而 Ruby 3.x 已移除该方法，
        # 会导致 `pod install` 直接报 "undefined method 'exists?' for class File" 而失败。
        # 这里在 pod install 前把 Flutter 工具里的写法改为 Ruby 3 的 File.exist?。
        run: |
          echo "FLUTTER_ROOT=$FLUTTER_ROOT"
          TARGET="$FLUTTER_ROOT/packages/flutter_tools"
          grep -rl "File\.exists?" "$TARGET" 2>/dev/null | while read -r f; do
            echo "patching: $f"
            sed -i '' 's/File\.exists?/File.exist?/g' "$f"
          done
          echo "补丁完成，校验是否还有残留："
          grep -rn "File\.exists?" "$TARGET" 2>/dev/null | head || echo "无残留 OK"

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install
          cd ..

      # 关键：Flutter 3.0.0 的 `build ipa` 不支持 --no-codesign（该 flag 只存在于 `build ios`），
      # 因此先构建「未签名」的 Runner.app，再按标准 IPA 结构打包：Payload/*.app + zip
      # 产物可用于 AltStore/Sideloadly 侧载，或在你的 Mac 上用 Xcode 重新签名
      - name: Build iOS app bundle (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          APP="build/ios/iphoneos/Runner.app"
          ls -ld "$APP"
          rm -rf Payload Runner.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Runner.ipa Payload
          ls -lh Runner.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: Runner.ipa
          if-no-files-found: error

      # ===== 可选：已签名出包（需在本仓库 Settings → Secrets 配置）=====
      # 1) 把发布证书与描述文件导出为 base64，存入仓库 Secrets：
      #    P12_BASE64、P12_PASSWORD、PROVISIONING_PROFILE_BASE64
      # 2) 取消注释下面的步骤，并去掉上面的 --no-codesign
      # - name: Import signing certificate
      #   run: |
      #     echo "${{ secrets.P12_BASE64 }}" | base64 --decode > cert.p12
      #     security create-keychain -p "" build.keychain
      #     security import cert.p12 -k build.keychain -P "${{ secrets.P12_PASSWORD }}" -T /usr/bin/codesign
      #     echo "${{ secrets.PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > profile.mobileprovision
      #     mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
      #     cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
      # - name: Build iOS IPA (signed)
      #   run: flutter build ipa --release
